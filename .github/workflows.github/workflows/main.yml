name: Daily Kids Cartoon Auto-Channel

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  make-and-upload-cartoon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Cloud Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Libraries
        run: pip install moviepy==1.0.3 edge-tts requests pillow google-api-python-client google-auth-oauthlib

      - name: Generate & Upload Cartoon Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python cartoon_bot.py

      - name: Save Video Backup
        uses: actions/upload-artifact@v4
        with:
          name: kids-cartoon-video
          path: output/kids_cartoon_short.mp4
